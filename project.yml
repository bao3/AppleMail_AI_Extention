name: MailKBAI
options:
  bundleIdPrefix: com.bao3
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    ARCHS: arm64
    VALID_ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
targets:
  MailKBAI:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/HostApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bao3.MailKBAI
        INFOPLIST_FILE: Config/HostApp-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/HostApp.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - target: MailKBAIExtension
        embed: true
      - sdk: MailKit.framework
      - sdk: EventKit.framework
      - sdk: Security.framework
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: libsqlite3.tbd
  MailKBAIExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/MailExtension
      - path: Resources/ExtensionAssets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bao3.MailKBAI.Extension
        INFOPLIST_FILE: Config/Extension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Extension.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - sdk: MailKit.framework
      - sdk: EventKit.framework
      - sdk: Security.framework
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: libsqlite3.tbd
  MailKBAITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/MailExtension
      - path: Tests/MailKBAITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bao3.MailKBAI.Tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - sdk: MailKit.framework
      - sdk: EventKit.framework
      - sdk: Security.framework
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: libsqlite3.tbd
  MailKBAIBatch:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/BatchCLI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bao3.MailKBAI.BatchCLI
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - sdk: MailKit.framework
      - sdk: EventKit.framework
      - sdk: Security.framework
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: libsqlite3.tbd
schemes:
  MailKBAI:
    build:
      targets:
        MailKBAI: all
        MailKBAIExtension: all
        MailKBAIBatch: all
        MailKBAITests: [test]
    test:
      targets:
        - MailKBAITests
  MailKBAITests:
    build:
      targets:
        MailKBAITests: [build, test]
    test:
      targets:
        - MailKBAITests
