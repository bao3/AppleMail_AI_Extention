name: macOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build AppleMailAI & MailAIExtension (unsigned CI check)
        run: |
          xcodebuild \
            -project AppleMailAI.xcodeproj \
            -scheme AppleMailAI \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Verify Extension bundle Info.plist & Assets.car
        run: |
          APPEX="build/DerivedData/Build/Products/Release/AppleMailAI.app/Contents/PlugIns/MailAIExtension.appex"
          test -d "$APPEX"
          /usr/libexec/PlistBuddy -c "Print :NSExtension" "$APPEX/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:MEComposeSession:MEComposeIcon" "$APPEX/Contents/Info.plist"
          test -f "$APPEX/Contents/Resources/Assets.car"
          echo "Verified MailAIExtension.appex bundle and Assets.car successfully."

      - name: Run unit tests (AppleMailAITests)
        run: |
          xcodebuild \
            -project AppleMailAI.xcodeproj \
            -scheme AppleMailAITests \
            -derivedDataPath build/DerivedData \
            test
